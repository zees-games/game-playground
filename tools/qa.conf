# What the shared QA scripts in dot-game/tools need to know about this game (sourced by perf_budget.sh, visual_check.sh).
# The client bench has no map switch (it hosts pg_flatgrass), so the one perf case is the real client against the real server there.
PERF_CASES=pg_flatgrass
PERF_SECONDS=20

perf_run_case() {
    GPU_TIMEOUT=300 timeout -k 10 360 ../gpu.sh run "$GAME" res://tools/client_bench.tscn -- \
        --delay 20 --play --seconds "$2" --json
}

VISUAL_CASES="pg_flatgrass"
VISUAL_SHOTS="overview eye park corner"

visual_render() { heavy -- timeout 600 tools/screenshot.sh "$1"; }
